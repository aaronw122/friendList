name: FriendList
options:
  bundleIdPrefix: com.friendlist
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    # Stable self-signed identity (scripts/make-signing-cert.sh) so the Full Disk
    # Access grant survives rebuilds. Ad-hoc ("-") mints a new cdhash each build
    # and TCC drops the grant. Run that script once before building.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "FriendList Dev"
    OTHER_CODE_SIGN_FLAGS: "--keychain $(HOME)/Library/Keychains/friendlist-signing.keychain-db"
    ENABLE_HARDENED_RUNTIME: YES
    # Xcode 16+ splits Debug builds into a thin launcher + FriendList.debug.dylib.
    # Our self-signed identity has no Team ID, so dyld rejects the dylib at launch
    # ("different Team IDs") → SIGABRT before any app code runs. Disabling this
    # reverts Debug to a single monolithic signed binary, which launches cleanly.
    # ENABLE_DEBUG_DYLIB is the effective switch; _SUPPORT alone doesn't propagate.
    ENABLE_DEBUG_DYLIB_SUPPORT: NO
    ENABLE_DEBUG_DYLIB: NO
targets:
  FriendList:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: App
      # Bundled LaunchAgent for the scheduled SMAppService.agent (08:00/12:00/20:00 --sync run).
      - path: LaunchAgents/com.friendlist.app.sync.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.friendlist.app
        INFOPLIST_FILE: App/Info.plist
        PRODUCT_NAME: FriendList
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
      configs:
        Debug:
          # Self-signed certificates have no Team ID, so hosted tests require Debug library validation off.
          ENABLE_HARDENED_RUNTIME: NO
    entitlements:
      path: App/FriendList.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
  FriendListTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: FriendList
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.friendlist.tests
        GENERATE_INFOPLIST_FILE: YES
